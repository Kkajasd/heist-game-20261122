<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Vault — a heist game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07090f;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game {
    display: block;
    width: 1280px;
    height: 860px;
    max-width: 100vw;
    max-height: 100vh;
    background: #141824;
    cursor: crosshair;
    image-rendering: auto;
  }
  noscript p {
    color: #f5f0dc;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="860"></canvas>
<noscript><p>The Velvet Vault needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
